<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4E6851">
  <meta name="description" content="Lexi — карточки, тесты и практика слов из Units 3–5 Academic English. Учись в своём темпе и возвращайся к сложному.">
  <title>Lexi — твой Academic English</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/style.css">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('lexi-theme')==='dark'?'dark':'light'}catch(e){}</script>
  <script defer src="./assets/words.js"></script>
  <script defer src="./assets/i18n.js"></script>
  <script defer src="./assets/home.js"></script>
  <script defer src="./assets/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержимому</a>
  <aside class="sidebar">
    <a class="brand" href="#home" aria-label="Lexi, главная"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 5v22h19M13 5v16h13" fill="none" stroke="currentColor" stroke-width="3"/></svg><span>lexi<span class="brand-dot">.</span></span></a>
    <nav class="side-nav" aria-label="Основная навигация">
      <button data-view="home"><span data-icon="home"></span>Обзор</button>
      <button data-view="cards"><span data-icon="cards"></span>Карточки</button>
      <button data-view="quiz"><span data-icon="check-square"></span>Тест</button>
      <button data-view="typing"><span data-icon="type"></span>Написание</button>
      <button data-view="dictionary"><span data-icon="book"></span>Словарь<span class="nav-count" id="nav-count">353</span></button>
      <button data-view="stats"><span data-icon="chart"></span>Мой прогресс</button>
    </nav>
    <div class="sidebar-course"><div class="course-title">Cambridge<br>Academic English</div><p>Intermediate · B1+</p><div class="course-bottom">Units 03 / 04 / 05</div></div>
    <button class="settings-link" data-action="settings"><span data-icon="sliders"></span>Настройки и данные</button>
    <div class="local-label"><span class="status-dot"></span>Прогресс на этом устройстве</div>
  </aside>
  <div class="main-shell">
    <header class="topbar"><div class="mobile-brand">lexi<span>.</span></div><div class="breadcrumb">Academic English <span>/</span> <strong>Units 3–5</strong></div><div class="top-actions"><label class="language-picker"><span class="hidden">Язык обучения</span><select id="language-select" aria-label="Язык обучения"><option value="ru" lang="ru">Русский</option><option value="kk" lang="kk">Қазақша</option></select></label><span class="streak-pill" id="streak-pill"></span><button class="icon-button theme-toggle" data-action="theme" aria-label="Переключить цветовую тему" title="Переключить тему"></button><button class="icon-button mobile-settings" data-action="settings" aria-label="Настройки"><span data-icon="sliders"></span></button></div></header>
    <main id="main" tabindex="-1"></main>
    <footer class="site-footer"><span>Слова из книги. Практика в своём темпе.</span><span>Cambridge Academic English · Intermediate</span></footer>
  </div>
  <nav class="mobile-nav" aria-label="Навигация на телефоне"><button data-view="home"><span data-icon="home"></span><span>Обзор</span></button><button data-view="cards"><span data-icon="cards"></span><span>Карточки</span></button><button data-view="quiz"><span data-icon="check-square"></span><span>Тест</span></button><button data-view="typing"><span data-icon="type"></span><span>Писать</span></button><button data-view="dictionary"><span data-icon="book"></span><span>Словарь</span></button></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="settings-dialog" aria-labelledby="settings-title"></dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <noscript><div class="no-js">Чтобы карточки работали, включи JavaScript в браузере.</div></noscript>
</body>
</html>
