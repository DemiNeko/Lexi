<!doctype html><meta charset="utf-8"><title>Lexi visual preview</title><style>body{margin:0;background:#d9dfd5;font:14px system-ui}header{padding:12px;display:flex;gap:10px;align-items:center}button,select{font:inherit;padding:10px}iframe{display:block;border:0;margin:0 auto;background:#fff}</style><header><strong>QA preview</strong><select id="width" aria-label="Viewport width"><option>390</option><option>320</option><option>768</option><option>1280</option></select><select id="view" aria-label="Page"><option>home</option><option>dictionary</option><option>cards</option><option>quiz</option><option>typing</option><option>stats</option></select><button id="reset">Fresh preview data</button><a href="browser-runner.html">Regression tests</a></header><iframe id="preview" title="Lexi preview" width="390" height="844"></iframe><script>const frame=document.getElementById('preview');function update(){frame.width=document.getElementById('width').value;frame.src='../index.html?preview='+Date.now()+'#'+document.getElementById('view').value;}document.getElementById('width').onchange=update;document.getElementById('view').onchange=update;document.getElementById('reset').onclick=()=>{localStorage.removeItem('lexi-progress-v1');localStorage.removeItem('lexi-session-v1');localStorage.setItem('lexi-language','ru');localStorage.setItem('lexi-theme','light');update()};update();</script>
